condition: pressure injury
synonyms: [pressure ulcer, bedsore, decubitus]
axes:
  - axis: stage
    level: required
    evidence_terms: [stage 1, stage 2, stage 3, stage 4, unstageable]
  - axis: site
    level: required
    evidence_terms: [sacrum, heel, buttock, hip, ankle]
  # RULE A(i): restored to required — correctness/p3 (already cited below for stage/site) explicitly
  # states the skin assessment form must note "its presence on admission", a condition-specific
  # governing instruction for the onset axis, not a glossary sentence. Previously mis-downgraded to
  # recommended with no explanatory comment; corrected per reviewer finding.
  - axis: onset
    level: required
    evidence_terms: [present on admission, hospital acquired]
recommendation: >-
  Pressure injury is documented without a stage or anatomical site. Please document the stage and
  site of the pressure injury, and whether it was present on admission, if known.
citations:
  - clause_id: "CDI-2021/correctness/p3"
    quote: >-
      The skin assessment form will note the laterality and stage of the pressure ulcer on a picture
      and also within the check boxes, as well as its presence on admission and the risk mitigation
      strategy to reduce progression.
