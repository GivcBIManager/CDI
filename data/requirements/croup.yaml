# RULE A(i): the Croup chapter states the agent axis, and p2 states the coding consequence of omitting the acuity.
condition: croup
synonyms: [laryngotracheobronchitis, LTB]
axes:
  - axis: agent
    level: required
    evidence_terms: ["parainfluenza", "viral", "bacterial", "allergies", "reflux", "due to"]
  - axis: onset
    level: required
    evidence_terms: ["acute", "chronic"]
recommendation: >-
  Croup is documented without the causative organism or without the acuity. Please document the
  causative organism and whether it is acute, if known.
citations:
  - clause_id: "CDI-2021/croup/p1"
    quote: >-
      Clinical documentation of croup, or acute laryngotracheobronchitis, should clearly be indicated
      by the causative organism, if known.
  - clause_id: "CDI-2021/croup/p2"
    quote: >-
      LTB without the term ‘acute’ will be classified as bronchitis by the coded data.
