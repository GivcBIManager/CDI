condition: acute respiratory failure
synonyms: [respiratory failure]
# "ARF" was a plain synonym here and nowhere else, so "ARF - creatinine trending up"
# produced a respiratory finding and no renal one. Now cue-gated on the mirror image of
# acute-kidney-injury.yaml's renal cue list.
ambiguous_synonyms:
  - term: ARF
    requires_nearby: [pO2, pCO2, oxygen, hypoxia, hypoxic, hypoxaemia, hypoxemia,
                      hypercapnia, hypercapnic, ventilation, ventilated, BiPAP, CPAP,
                      intubated, SpO2, ABG, blood gas, respiratory, sats, saturations]

axes:
  - axis: onset
    level: required
    evidence_terms: [acute, acute on chronic, chronic]
    recommendation: >-
      Acute respiratory failure is documented without the onset. Please document whether it
      is acute, chronic or acute on chronic, if known.
  - axis: type
    level: required
    evidence_terms: [type 1, type 2, hypoxic, hypercapnic]
    recommendation: >-
      Acute respiratory failure is documented without the type. Please document whether it
      is type 1 (hypoxic) or type 2 (hypercapnic), if known.
recommendation: >-
  Acute respiratory failure is documented without the type (1 or 2) or the onset (acute vs acute on
  chronic). Please document the type and onset, if known.
citations:
  - clause_id: "CDI-2021/acute-on-chronic-conditions/p2"
    quote: >-
      Or when acute on chronic respiratory failure is documented, two separate codes are used to
      classify the acute respiratory failure and chronic respiratory failure.
  - clause_id: "CDI-2021/criteria-for-assigning-an-adx/p4"
    quote: >-
      For example, a patient with pneumonia develops acute respiratory failure type 2 and requires
      oxygen therapy via High Flow Nasal Prongs for 15 hours.
