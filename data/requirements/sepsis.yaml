condition: sepsis
synonyms: [septicemia, septicaemia, urosepsis, septic shock]
axes:
  - axis: agent
    level: required
    evidence_terms: [due to, staphylococcus, e.coli, klebsiella, pseudomonas, streptococcus, culture]
  - axis: type
    level: required
    evidence_terms: [severe sepsis, septic shock, localized, systemic, septicaemia]
recommendation: >-
  Sepsis is documented without the causative organism or without specifying whether it is severe
  sepsis or septic shock. Please document the infective agent and the severity classification of the
  sepsis, if known.
citations:
  - clause_id: "CDI-2021/sepsis/p1"
    quote: >-
      The infective agent should be documented and confirmed by the clinician, including any
      antimicrobial resistance. Sepsis is classified by several different codes and the clinical
      documentation plays an integral role in its classification. Clinical documentation should
      reflect if the sepsis is considered ‘severe sepsis’ or when clinically indicated as ‘septic
      shock’ as these qualifying terms will change how the clinical concept is represented in the
      data.
