condition: chronic kidney disease
synonyms: [CKD, chronic renal failure, chronic kidney failure, chronic renal impairment]
axes:
  - axis: stage
    level: required
    evidence_terms: ["stage 1", "stage 2", "stage 3", "stage 4", "stage 5",
                     "stage i", "stage ii", "stage iii", "stage iv", "stage v",
                     "esrd", "end stage", "end-stage"]
  - axis: onset
    level: recommended
    evidence_terms: ["acute on chronic", "progressive", "new", "known", "long-standing"]
recommendation: >-
  Chronic kidney disease is documented without a stage. Please document the
  CKD stage (1-5, or end-stage) and its basis (eGFR), if known.
# V3 re-anchor: the prior sole citation (documenting-for-specificity/p3) is a generic cross-condition
# example, not the governing clause. The dedicated Chronic Kidney Disease (CKD) section carries an
# explicit, condition-specific mandate ("the stage or eGFR should be recorded") that outranks the
# generic example for the "stage"-focused retrieval query; re-anchored to that clause as primary,
# with p3 kept as a secondary supporting citation (still the specific worked example for CKD staging).
# CHI secondary: CHI-CKD (KDIGO 2013 CKD guideline) Section 1.2 "STAGING OF CKD" (CHI-CKD/pg18/p3)
# is a condition-specific governing clause too — it explicitly recommends classifying CKD by cause,
# GFR category, and albuminuria category — added as a secondary citation.
citations:
  - clause_id: "CDI-2021/chronic-kidney-disease-ckd/p1"
    quote: >-
      In the case of CKD, the stage or eGFR should be recorded within the documentation along with
      any underlying cause such as diabetes, hypertension or drug induced.
  - clause_id: "CDI-2021/documenting-for-specificity/p3"
    quote: >-
      A disease may be described as 1st, 2nd, 3rd or 4th degree; or Stage 1
      through to 5. For example, a second degree burn or chronic kidney
      failure stage 4.
  # Re-anchored after the step-4 extraction fix: de-fusing this source re-paragraphs
  # page 18, moving the CGA recommendation from p2 to p3. The quote is unchanged --
  # it already matched verbatim, only its clause ordinal moved.
  - clause_id: "CHI-CKD/pg18/p3"
    quote: >-
      We recommend that CKD is classified based on cause, GFR category, and albuminuria category
      (CGA). (1B)
