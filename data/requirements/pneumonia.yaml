condition: pneumonia
# Synonyms from CHI-LRTI (the "Targeted population" clause CHI-LRTI/pg3/p1 and the pg2
# abbreviation list): the protocol's own names for the condition -- HAP / VAP, community-,
# hospital- and ventilator-acquired pneumonia, "lower respiratory infection". Hyphenated
# and spaced spellings are both listed because the matcher joins words with \s+ only.
# Deliberately NOT synonyms: the bare modifiers "aspiration", "nosocomial", "community
# acquired", "hospital acquired" -- they qualify many conditions (a hospital-acquired UTI, a
# joint aspiration) and as synonyms would raise pneumonia findings on notes that never
# mention pneumonia (tests/test_pneumonia_requirement.py). They stay ONSET evidence terms
# below, where they belong. Also NOT a synonym or onset term: bare "CAP" -- matching is
# case-insensitive, so it fires on the capsule abbreviation ("500 mg cap PO") and "knee cap"
# (final-review finding); only the spelled-out community-acquired forms are used.
synonyms: [HAP, VAP, chest infection, LRTI, lower respiratory tract infection,
           lower respiratory infection,
           community acquired pneumonia, community-acquired pneumonia,
           hospital acquired pneumonia, hospital-acquired pneumonia,
           ventilator acquired pneumonia, ventilator-acquired pneumonia,
           ventilator associated pneumonia, ventilator-associated pneumonia,
           aspiration pneumonia, nosocomial pneumonia]
axes:
  # RULE A(i): booklet Respiratory Conditions p3 is an explicit documentation imperative
  # ("should note it as nosocomial or hospital acquired"). CHI-LRTI corroborates it from the
  # treatment side: the protocol is organised by onset setting ("Community Acquired
  # Pneumonia (1)" vs "Hospital Acquired Pneumonia/Ventilator acquired pneumonia (2)") and
  # its population clause (CHI-LRTI/pg3/p1) enumerates exactly community-, hospital- and
  # ventilator-acquired pneumonia -- so the ventilator setting joins the onset terms.
  - axis: onset
    level: required
    evidence_terms: [community acquired, community-acquired, hospital acquired, hospital-acquired,
                     ventilator acquired, ventilator-acquired, ventilator associated,
                     ventilator-associated, aspiration, nosocomial, HAP, VAP]
    recommendation: >-
      Pneumonia is documented without the onset setting. Please document whether it is
      community-, hospital- or ventilator-acquired, or aspiration pneumonia, if known.
  # RULE A(i): booklet Respiratory Conditions p2 ("pneumonia due to pseudomonas"). The
  # CHI-LRTI HAP/VAP section (CHI-LRTI/pg6/p1) adds a genuine imperative that turns on the
  # agent being known -- "Patient should be shifted to specific antibiotic depend on the
  # culture result" -- and names the organisms its empiric regimens are chosen for
  # (S. aureus MSSA/MRSA, P. aeruginosa, gram-negative bacilli, MDR; influenza virus on pg5),
  # which are added here as agent evidence terms.
  - axis: agent
    level: required
    evidence_terms: [due to, klebsiella, pseudomonas, e.coli, staphylococcus, streptococcus,
                     MRSA, MSSA, S. aureus, staph. aureus, staph aureus, P. aeruginosa,
                     gram-negative, gram negative, influenza, carbapenem-resistant, MDR]
    recommendation: >-
      Pneumonia is documented without the causative organism. Please document the infective
      agent (e.g. the culture result), if known.
  # RULE B (CHI-LRTI-derived, recommended only): the CAP section stratifies therapy by
  # severity -- "Inpatients, non-severe" vs "Inpatients, severe" regimen groups (pg4-5) and
  # the PSI risk-class -> disposition table (pg4) -- but the protocol never says severity
  # "must be documented"; its PSI clause (CHI-LRTI/pg4/p1, cited below) is a definition, not
  # an imperative, and the severity-group rows themselves are table cells the chunker cannot
  # quote cleanly. Recommended, not required; no booklet clause covers pneumonia severity.
  # CURB-65 is listed alongside PSI as the ATS/IDSA alternative score (the protocol's
  # reference 1) -- it only ever marks the axis PRESENT, the safe direction.
  - axis: type
    level: recommended
    evidence_terms: [severe, non-severe, non severe, PSI, CURB-65, CURB 65, risk class]
    recommendation: >-
      Pneumonia is documented without the severity. Please document the severity class
      (severe vs non-severe, CURB-65 or PSI risk class), if known.
recommendation: >-
  Pneumonia is documented without the onset setting, the causative organism, or the severity.
  Please document whether it is community-, hospital- or ventilator-acquired, the infective agent
  (e.g. the culture result), and the severity class (severe vs non-severe, PSI risk class), if
  known.
# Citation order: the booklet Respiratory Conditions clauses stay primary -- they are the CDI
# documentation authority and carry explicit "should note" / "should state" imperatives. The
# three CHI-LRTI clauses are condition-specific CHI secondaries (same pattern as CKD's
# CHI-CKD/pg18/p3), each trimmed to its governing sentence: pg3/p1 = the population clause
# that classifies the condition by onset setting; pg6/p1 = the culture-result imperative
# (agent); pg4/p1 = the PSI severity definition (type; disclosed above as definitional, not an
# imperative). Quotes copied verbatim from `cli quote`. pg3/p1's stored section_title is a pg2
# abbreviation-line artifact of the heading heuristic ("SC, SQ: subcutaneous") -- the
# page-anchored clause_id is unaffected and the standard V3 query reaches the page directly.
citations:
  - clause_id: "CDI-2021/respiratory-conditions/p3"
    quote: >-
      Any risk factors for pneumonia, including risk mitigation, must be clearly documented in the
      admission notes. Should the patient develop pneumonia during the admission, the clinician should
      note it as nosocomial or hospital acquired.
  - clause_id: "CDI-2021/respiratory-conditions/p2"
    quote: >-
      The CDS should review the pathology, including sputum tests, to identify if the agent of
      infection has been identified and recorded. To show the agent of the infection or pneumonia,
      clinical documentation should state “pneumonia due to pseudomonas” or “aspiration pneumonia due
      to inhalation of blood”.
  - clause_id: "CHI-LRTI/pg3/p1"
    quote: >-
      Targeted population: Hospitalized immunocompetent patients who are diagnosed with Lower
      respiratory infection (Community acquired pneumonia, hospital acquired pneumonia and
      ventilator acquired pneumonia)
  - clause_id: "CHI-LRTI/pg6/p1"
    quote: >-
      Patient should be shifted to specific antibiotic depend on the culture result within 3-5 days
  - clause_id: "CHI-LRTI/pg4/p1"
    quote: >-
      Definition of PSI: The pneumonia severity index is a rigorously studied prediction rule for
      prognosis that objectively stratifies patients into quintiles of risk for short-term mortality
      on the basis of 20 demographic and clinical variables routinely available at presentation.
