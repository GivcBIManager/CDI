condition: heart failure
synonyms: [HF, CCF, CHF, cardiac failure]
axes:
  # RULE A(i): CHI-HF (2022 AHA/ACC/HFSA Heart Failure Guideline) Section 2.2 "Classification of
  # HF by Left Ventricular Ejection Fraction" states the EF-based classification scheme
  # (HFrEF/HFmrEF/HFpEF/HFimpEF) that documenting HF "type" is built on (Figure 3 caption,
  # CHI-HF/pg14/p3) — a genuine condition-specific classification clause, unlike the booklet's
  # generic mandate. Re-anchored: CHI-HF/pg14/p3 is now the primary citation; the booklet's
  # Documenting for Specificity mandate clause (p8) is kept as a secondary citation, and the
  # definitional p1 clause is kept as a secondary citation too.
  - axis: type
    level: required
    evidence_terms: [systolic, diastolic, HFrEF, HFpEF, reduced ejection, preserved ejection]
  # RULE B: no condition-specific clause found for onset (searched "acute decompensated",
  # "new-onset heart failure", "acute on chronic", "chronic heart failure is" — CHI-HF only uses
  # these as inclusion-criteria phrasing for unrelated workup recommendations, not as an onset
  # documentation mandate); no mandate-clause stacking beyond the one already used for 'type'
  # above; kept at recommended, no citation.
  - axis: onset
    level: recommended
    evidence_terms: [acute, chronic, acute on chronic]
recommendation: >-
  Heart failure is documented without specifying systolic vs diastolic (reduced vs preserved
  ejection fraction) type. Please document the type of heart failure, if known.
# CHI governance disclosure (Task 6 reviewer fix): CHI-HF/pg14/p3 is a FIGURE CAPTION ("The
# classification for baseline and subsequent LVEF IS SHOWN...") describing the EF-based
# classification scheme, not an imperative documentation/classification instruction — it never
# says HF type "should be classified" or "must be documented". Grepped all 721 CHI-HF clauses for
# "should be classified", "should be documented", "should specify", "type of heart failure",
# "diagnosis of heart failure" — zero hits; the guideline's actual imperative prose (e.g. Section
# 2.2's body text, CHI-HF/pg13/p1) is corrupted by two-column PDF extraction bleed (interleaved,
# unquotable without splicing unrelated column text mid-sentence — see task-6-report.md). This
# figure caption is therefore the BEST QUOTABLE governing clause in the corpus for HF type, not a
# genuine mandate; the booklet's Documenting for Specificity mandate clause (p8) is kept as a
# secondary citation precisely because CHI-HF itself carries no explicit documentation imperative.
citations:
  # Re-anchored after the step-4 extraction fix. pdfplumber's default x_tolerance
  # fused this page's words; the de-fused text re-paragraphs, so the clause is now
  # pg14/p2 and the quote is readable prose rather than
  # "TheclassificationforbaselineandsubsequentLVEFisshown". Same sentence, same
  # figure caption, same governance caveat above -- and CHI-HF/pg13/p1 is STILL
  # two-column-interleaved after the fix (column bleed is a layout problem, not a
  # character-spacing one), so this caption remains the best quotable clause.
  - clause_id: "CHI-HF/pg14/p3"
    quote: >-
      The classification for baseline and subsequent LVEF is shown. Patients with HFrEF who
      improve their LVEF to >40% are considered to have HFimpEF and should continue HFrEF
      treatment.
  - clause_id: "CDI-2021/documenting-for-specificity/p8"
    quote: >-
      When documenting any condition, use as many of these descriptors as clinically relevant to
      convey full specificity of the condition. This will improve both funding, research data and
      patient care.
  - clause_id: "CDI-2021/documenting-for-specificity/p1"
    quote: >-
      The descriptor “type” really means qualifying terms that categorise the condition into a broad
      group.
