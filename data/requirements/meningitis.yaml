# RULE A(i): the Meningitis chapter names the organism axis directly.
condition: meningitis
synonyms: [encephalomeningitis, meningococcal]
axes:
  - axis: agent
    level: required
    evidence_terms: ["bacterial", "viral", "pneumococcal", "meningococcal", "streptococcus", "haemophilus", "due to", "organism"]
recommendation: >-
  Meningitis is documented without the specific organism. Please document the causative organism
  and any related inflammation of the brain, if known.
citations:
  - clause_id: "CDI-2021/meningitis/p1"
    quote: >-
      clinical documentation for meningitis in children should clearly document in the body of the
      notes the specific organism, if known, in addition to any related inflammation of the brain such
      as encephalomeningitis.
