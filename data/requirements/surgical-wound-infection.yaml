condition: surgical wound infection
synonyms: [post-op wound infection, surgical site infection, SSI]
axes:
  - axis: onset
    level: required
    evidence_terms: [complicating surgery, post procedural, complication, postprocedural]
  # DEVIATION: no booklet text links a causative organism specifically to surgical/wound infection. Downgraded from planned 'required' to 'recommended', citing only the generic 'agent' axis definition.
  - axis: agent
    level: recommended
    evidence_terms: [due to, staphylococcus, e.coli, klebsiella, pseudomonas]
recommendation: >-
  Surgical wound infection is documented without confirming it as a postprocedural complication or
  naming the causative organism. Please document the causative organism and confirm the infection is
  postprocedural, if known.
citations:
  - clause_id: "CDI-2021/pelvic-collection/p1"
    quote: >-
      Recording the right clinical documentation for a postprocedural wound infection is pivotal to
      ensure this significant clinical concept can be captured.
  - clause_id: "CDI-2021/documenting-for-specificity/p4"
    quote: >-
      When we talk about documenting the agent, we mean clearly naming the pathogens or agents of
      illness within the body of the progress notes and discharge summary; this includes drawing a
      link between the agent and the condition. Agent also means the type of agent or causative
      organism or virus relevant to the affected body system; for example, pneumonia due to
      klebsiella, or a urinary tract infection due to E.Coli or sepsis due to staphylococcus aureus.
