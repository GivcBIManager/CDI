condition: urinary tract infection
synonyms: [UTI, cystitis, pyelonephritis]
axes:
  # Distinction note (reviewer-adjudicated): this entry's citation (documenting-for-specificity/p4)
  # is the same generic "documenting the agent" clause used by surgical-wound-infection.yaml, but its
  # quote carries a condition-specific worked example naming UTI directly ("a urinary tract infection
  # due to E.Coli") — RULE A(i), a condition-specific governing instruction embedded in an otherwise
  # generic clause. Kept required on that basis. Contrast surgical-wound-infection.yaml, where the
  # same clause carries no surgical/wound-specific worked example and its agent axis stays
  # recommended.
  - axis: agent
    level: required
    evidence_terms: [due to, e.coli, e. coli, klebsiella, pseudomonas]
    recommendation: >-
      Urinary tract infection is documented without the causative organism. Please document
      the infective agent, if known.
  # DEVIATION / RULE B: no booklet text distinguishes upper (pyelonephritis) vs lower (cystitis) UTI,
  # and the Documenting for Specificity chapter has no dedicated 'site' definition paragraph, nor does
  # the mandate clause name any site distinction, to fall back on either. Downgraded from planned
  # 'required' to 'recommended' with no citation.
  - axis: site
    level: recommended
    evidence_terms: [cystitis, pyelonephritis, lower, upper]
    # Axis-level query text: the condition-level `recommendation` below is about the AGENT,
    # so a "missing site" finding used to tell the clinician to document an organism the
    # note already documented. This axis asks the question it actually raises.
    recommendation: >-
      Urinary tract infection is documented without specifying the site. Please document
      whether this is an upper (pyelonephritis) or lower (cystitis) urinary tract
      infection, if known.
recommendation: >-
  Urinary tract infection is documented without the causative organism. Please document the
  infective agent, if known.
citations:
  - clause_id: "CDI-2021/documenting-for-specificity/p4"
    quote: >-
      When we talk about documenting the agent, we mean clearly naming the pathogens or agents of
      illness within the body of the progress notes and discharge summary; this includes drawing a
      link between the agent and the condition. Agent also means the type of agent or causative
      organism or virus relevant to the affected body system; for example, pneumonia due to
      klebsiella, or a urinary tract infection due to E.Coli or sepsis due to staphylococcus aureus.
