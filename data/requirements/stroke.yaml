condition: stroke
synonyms: [CVA, cerebrovascular accident]
axes:
  # RULE A(i): CHI-STROKE (Saudi Stroke Standards) Standard 5, item 2 (CHI-STROKE/pg60/p1)
  # explicitly mandates that "stroke subtype should be classified through prompt identification
  # of the underlying cerebrocardiovascular cause" — a genuine condition-specific classification
  # clause for stroke type (ischemic vs hemorrhagic and its subtype), unlike the booklet's generic
  # mandate. Re-anchored: CHI-STROKE/pg60/p1 is now the primary citation for 'type', which is
  # upgraded from recommended to required on the strength of this clause.
  - axis: type
    level: required
    evidence_terms: [ischemic, ischaemic, hemorrhagic, haemorrhagic]
  # RULE A(ii): searched "onset", "sequela", "TIA", "recurrent", "acute care" — no condition-specific
  # governing clause anywhere in CHI-STROKE mandates documenting stroke onset chronology (onset
  # terms appear only in KPI time-to-treatment metrics and the glossary's "Acute care" definition,
  # neither a documentation mandate). Kept anchored to the Documenting for Specificity mandate
  # clause (p8) as before; p6 kept as a secondary citation since it names "sequela of" as a
  # standard onset term.
  - axis: onset
    level: required
    evidence_terms: [sequela, new, acute]
recommendation: >-
  Stroke is documented without specifying whether it is a new event or a sequela of a prior stroke.
  Please document the onset and, if known, whether it is ischemic or hemorrhagic.
citations:
  - clause_id: "CHI-STROKE/pg60/p1"
    quote: >-
      Risk of recurrent stroke should be assessed, and stroke subtype should be classified
      through prompt identification of the underlying cerebrocardiovascular cause.
  - clause_id: "CDI-2021/documenting-for-specificity/p8"
    quote: >-
      When documenting any condition, use as many of these descriptors as clinically relevant to
      convey full specificity of the condition. This will improve both funding, research data and
      patient care.
  - clause_id: "CDI-2021/documenting-for-specificity/p6"
    quote: >-
      Documenting onset is important as it provides clear indication of disease chronology, the
      underlying cause or how long it has been present.
