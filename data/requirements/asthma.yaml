# RULE A(i): the Asthma chapter carries a condition-specific documentation instruction naming the type values directly.
condition: asthma
synonyms: [asthmatic]
axes:
  - axis: type
    level: required
    evidence_terms: ["allergic", "nonallergic", "non-allergic", "mixed", "acute severe", "intermittent", "persistent"]
  - axis: agent
    level: recommended
    evidence_terms: ["respiratory syncytial virus", "rsv", "due to", "viral", "bacterial"]
recommendation: >-
  Asthma is documented without the type. Please document whether the asthma is allergic,
  nonallergic or mixed, and the type (e.g. acute severe), if known.
citations:
  - clause_id: "CDI-2021/asthma/p1"
    quote: >-
      Clinical documentation should clearly indicate if the asthma is allergic, nonallergic, or mixed,
      in addition to the type, if known.
