# CHI-NEC-FBG: "Medical Necessity Criteria for Fasting Blood Glucose Testing"
# (CHI, in collaboration with the National Diabetes Center at the Saudi Health
# Council).
# RULE: pg3/p1 states the guide's purpose is to screen/diagnose/monitor glucose
# metabolism-related disorders; pg3/p4 gives the population-level age/risk-factor
# indications for FBG testing -- both anchor "required".
order: fasting-glucose
display_name: Fasting Blood Glucose (FBG) testing
order_terms: ["fasting blood glucose", "fasting glucose", "FBG"]
# Context cues are order-SPECIFIC verb phrases (a result can be reported
# without any of these); bare ambiguous verbs (check/obtain/send/draw/collect/
# sent) were dropped after review found them false-firing on result-reporting
# text (e.g. "HbA1c 8.1% today. Plan: continue home meds."). "plan:" only
# counts when it is on the SAME LINE as the order-term match (see
# necessity.py), not within the +/-60 char window used for the other cues.
context_cues: ["order", "ordered", "ordering", "requested", "request", "send for", "sent for", "sending", "arrange", "arranged", "will obtain", "to obtain", "please check", "will check", "to be checked", "repeat", "plan:"]
# Indication terms mined from the age/risk-factor indications (pg2/p2, pg3/p4):
# overweight/obese, and the listed risk factors (first-degree relative with
# diabetes, physical inactivity, cardiovascular disease, polycystic ovary
# syndrome).
valid_indication_terms: ["diabetes", "overweight", "obese", "cardiovascular disease", "polycystic ovary syndrome", "physical inactivity"]
level: required
recommendation: >-
  A fasting blood glucose order is documented without a supporting indication. Please
  document the indication, if applicable (e.g. age/risk-factor screening criteria, or a
  glucose-metabolism disorder being investigated).
citations:
  - clause_id: "CHI-NEC-FBG/pg3/p1"
    quote: >-
      This guide provides evidence-based recommendations for the use of Fasting Blood Glucose (FBG)
      to screen, diagnose, and monitor Glucose metabolism-related disorders and conditions.
  - clause_id: "CHI-NEC-FBG/pg3/p4"
    quote: >-
      All individuals ≥35 years of age should undergo fasting blood glucose (FBG)
      testing.
