doc_type: progress_note
elements:
  # RULE B: booklet "Different Types of Documentation" > Progress Note section (p.71) describes
  # what the note "is intended to reflect" -- no "must"/"mandatory" language anywhere in this
  # (thin) section. All three elements below are downgraded to recommended on that basis; searched
  # "progress note", "SOAP" -- no stronger condition-specific mandate clause found.
  - name: presenting_complaint_management
    # Wave 4 fix: the original three terms are the BOOKLET's vocabulary, not a clinical
    # note's -- a note with a twelve-item assessment/plan documenting management of every
    # active problem still reported this element missing, because it never used the phrase
    # "presenting complaint". The cited clause is about "the actions taken by the clinician
    # to manage" those problems, so a documented Plan section now satisfies it.
    # Treatment verbs ("continue", "titrated", "weaned") were considered and REJECTED: they
    # are ordinary English words, and ALLOWED_SINGLE_WORD_TERMS' stated convention admits
    # only clinical acronyms/shorthand, never ordinary words. Widening the guard to fit them
    # would trade a false positive for silent suppression of real gaps.
    # RESIDUAL: a note that documents management purely in narrative, with no Plan heading
    # and none of the phrases below ("Continued meropenem, held antihypertensives"), still
    # reports this element missing. Closing that needs structure, not more terms.
    evidence_terms: ["presenting complaint", "co-morbidities", "comorbidities",
                     "management plan", "treatment plan", "plan of care", "care plan",
                     "actions taken", "plan:"]
    level: recommended
    recommendation: >-
      The progress note does not document the actions taken to manage the presenting complaint,
      active co-morbidities, or conditions arising during the episode of care. Please document the
      clinical actions taken.
    citations:
      - clause_id: "CDI-2021/progress-note/p1"
        quote: >-
          The progress note is intended to reflect the progress of the patient across an episode of care and the actions taken by the clinician to manage the presenting complaint, active co-morbidities and any conditions arising in the episode of care.
  # Evidence terms tightened (reviewer fix, wave 1): bare "wellbeing" and "behaviour" are common
  # English words that would match ordinary unrelated commentary and silently suppress a real
  # completeness gap. Replaced with the phrase-anchored forms the source clause itself uses
  # ("physical wellbeing", "physical appearance") plus a behavioural-observation phrase.
  # Wave 2 fix: added the colon-anchored header forms "behaviour:"/"behavior:" (both spellings) so
  # a real "Behaviour:" section header is actually detected. "mood:" was considered but the cited
  # clause does not mention mood anywhere -- skipped rather than fabricated.
  - name: wellbeing_observations
    evidence_terms: ["physical wellbeing", "emotional state", "physical appearance",
                     "behavioural observations", "behaviour:", "behavior:"]
    level: recommended
    recommendation: >-
      The progress note does not document observations of the patient's wellbeing. Please include
      observations related to behaviour, emotional state, physical wellbeing and appearance.
    citations:
      - clause_id: "CDI-2021/progress-note/p1"
        quote: >-
          The progress note should include observations related to behaviour, emotional state, physical wellbeing and physical appearance. This note should include relevant information related to incidents or health concerns that impact on a patient’s wellbeing.
  # Evidence terms colon-anchored (reviewer fix): bare "subjective"/"objective" are common
  # English words; anchored with ":" like the SOAP heading style itself, consistent with the
  # existing "assessment:"/"plan:" terms.
  # Wave 3 fix: added the single-letter "S:"/"O:"/"A:"/"P:" forms -- the SOAP heading style
  # is very commonly abbreviated to just the letter in real notes, and doctype.py's own
  # SOAP-shape detector uses exactly this pattern. The word-boundary lookbehind in
  # gapcheck.term_pattern prevents a false match against an unrelated word ending in one of
  # these letters immediately before the colon (e.g. "Labs:" does NOT match "s:" -- the
  # character before "s" is "b", not a boundary).
  - name: soap_structure
    evidence_terms: ["subjective:", "objective:", "assessment:", "plan:",
                     "s:", "o:", "a:", "p:"]
    level: recommended
    recommendation: >-
      The progress note does not follow the SOAP structure. Please document Subjective impressions,
      Objective measurable outcomes, an Assessment and a Plan to treat.
    citations:
      - clause_id: "CDI-2021/soap-notes-style/p1"
        quote: >-
          According to the SOAP notes style, documentation should be Subjective impressions, Objective measurable outcomes, Assessment reflecting analysis and Plan to treat.
